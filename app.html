<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#1a2e1a"/>
<title>Future Makers</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon-192.png"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg-primary:#f0f4f0; --bg-secondary:#e8ede8; --bg-hover:#f5f8f5; --bg-input:#f7faf7;
  --sidebar-bg:#1a2e1a; --sidebar-hover:#243624; --sidebar-active:#2d4a2d;
  --accent:#25d366; --accent-dark:#128c4a; --accent2:#34b7f1; --accent3:#ff9f0a;
  --accent-dim:rgba(37,211,102,0.10); --accent2-dim:rgba(52,183,241,0.10);
  --danger:#e53935; --danger-dim:rgba(229,57,53,0.09);
  --warning:#f59e0b; --warning-dim:rgba(245,158,11,0.10);
  --owner:#7c3aed; --owner-dim:rgba(124,58,237,0.09);
  --font-display:'Nunito',sans-serif; --font-body:'DM Sans',sans-serif;
  --radius:12px; --radius-sm:8px;
  --shadow:0 2px 16px rgba(0,0,0,0.08); --shadow-md:0 4px 24px rgba(0,0,0,0.11);
  /* FM legacy names — every inline style in the app flows through these */
  --ink:#111b11; --paper:#f0f4f0; --signal:#25d366; --go:#128c4a; --stop:#e53935;
  --card:#ffffff; --line:rgba(0,0,0,0.07); --muted:#4a6454; --lgo:rgba(37,211,102,0.10);
  --bar:#1a2e1a; --fab:#25d366;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:15px;min-height:100vh}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(circle,rgba(37,211,102,0.07) 1px,transparent 1px);background-size:28px 28px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
.hide{display:none!important}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(37,211,102,0.3);border-radius:2px}
/* ---------- login (WatchOwl split-card, stacked) ---------- */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;position:relative;z-index:1;background:linear-gradient(135deg,#e8f5e9 0%,#f0f4f0 50%,#e3f2fd 100%)}
.lg-top{background:linear-gradient(160deg,#1a2e1a 0%,#0d1f0d 100%);color:#e8f5e9;padding:34px 30px 26px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:430px;border-radius:24px 24px 0 0;position:relative;overflow:hidden}
.lg-top::before{content:'';position:absolute;bottom:-70px;right:-70px;width:220px;height:220px;border-radius:50%;background:rgba(37,211,102,0.10)}
.lg-brand{display:flex;align-items:center;gap:12px;font-family:var(--font-display);font-weight:900;font-size:19px;letter-spacing:1px;text-transform:uppercase}
.lg-h{font-family:var(--font-display);font-size:23px;font-weight:900;line-height:1.3;margin-top:2px}
.lg-sub{color:rgba(232,245,233,0.55);font-size:13px;line-height:1.55}
.lg-form{background:#fff;padding:26px 30px 30px;max-width:430px;width:100%;border-radius:0 0 24px 24px;box-shadow:0 20px 60px rgba(0,0,0,0.12)}
.lg-lbl{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:14px 0 6px;font-family:var(--font-display)}
.lg-inp{width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--line);background:var(--bg-input);font-size:15px}
.lg-inp:focus{outline:none;border-color:var(--accent)}
.lg-btn{width:100%;margin-top:22px;padding:13px;border:none;border-radius:var(--radius-sm);background:var(--accent);color:#fff;font-family:var(--font-display);font-weight:800;font-size:14px;letter-spacing:.6px;text-transform:uppercase;box-shadow:0 4px 16px rgba(37,211,102,0.35);transition:all .2s}
.lg-btn:hover{background:var(--accent-dark)} .lg-btn:active{transform:scale(.98)}
.lg-err{margin-top:12px;color:var(--stop);font-size:13px;font-weight:600}
/* ---------- shell ---------- */
#shell{min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}
.topbar{background:rgba(255,255,255,0.92);backdrop-filter:blur(16px);color:var(--ink);padding:13px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);box-shadow:0 1px 8px rgba(0,0,0,0.06)}
.topbar::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(37,211,102,0.25),transparent)}
.topbar .nm{font-family:var(--font-display);font-weight:900;font-size:15px;letter-spacing:1px;text-transform:uppercase}
.pg-title{display:none;font-family:var(--font-display);font-weight:900;font-size:15px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink)}
.live-badge{display:none;align-items:center;gap:6px;padding:5px 12px;background:rgba(37,211,102,0.08);border:1px solid rgba(37,211,102,0.22);border-radius:99px;font-size:9.5px;color:var(--accent-dark);font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}}
.topbar .who{margin-left:auto;text-align:right;font-size:11px;color:var(--muted);line-height:1.3}
.role-tag{display:inline-block;background:var(--accent);color:#fff;border-radius:6px;padding:1px 7px;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.main{flex:1;padding:18px 16px 96px;max-width:980px;width:100%;margin:0 auto}
/* ---------- sidebar (desktop = the WatchOwl layout) ---------- */
.sidebar{display:none;position:fixed;left:0;top:0;bottom:0;width:230px;background:var(--sidebar-bg);flex-direction:column;z-index:100;box-shadow:4px 0 20px rgba(0,0,0,0.15);overflow:hidden}
.sidebar::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.3}
.sb-logo{padding:20px 18px;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;gap:11px}
.sb-logo-ic{width:38px;height:38px;border-radius:10px;background:rgba(37,211,102,0.12);border:1px solid rgba(37,211,102,0.22);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-logo-t{font-family:var(--font-display);font-size:14px;color:#fff;font-weight:900;letter-spacing:1px;text-transform:uppercase;line-height:1.15}
.sb-logo-s{font-size:8.5px;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;opacity:.75;margin-top:2px}
.sb-create{padding:12px 14px 4px}
.btn-create{width:100%;padding:11px 14px;background:var(--accent);border:none;border-radius:var(--radius-sm);color:#fff;font-family:var(--font-display);font-size:12.5px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;box-shadow:0 3px 12px rgba(37,211,102,0.35);text-transform:uppercase}
.btn-create:hover{background:#1db954;box-shadow:0 4px 18px rgba(37,211,102,0.5)} .btn-create:active{transform:scale(.97)}
.sb-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-top:6px}
.sb-scroll::-webkit-scrollbar{width:3px}.sb-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12)}
.nav-section{padding:6px 12px;margin-bottom:2px}
.nav-label{font-size:9px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:.12em;padding:0 8px;margin-bottom:4px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius-sm);cursor:pointer;transition:all .15s;font-size:13px;color:rgba(255,255,255,0.55);font-weight:500;position:relative;border:1px solid transparent;background:none;width:100%;text-align:left;font-family:var(--font-body)}
.nav-item:hover{background:var(--sidebar-hover);color:rgba(255,255,255,0.9)}
.nav-item.active{background:rgba(37,211,102,0.14);color:var(--accent);border-color:rgba(37,211,102,0.2)}
.nav-item.active::before{content:'';position:absolute;left:-1px;top:25%;bottom:25%;width:3px;background:var(--accent);border-radius:2px;box-shadow:0 0 8px var(--accent)}
.nav-item.owner-nav{color:rgba(191,148,255,0.75)}
.nav-item.owner-nav:hover{background:rgba(124,58,237,0.12);color:rgba(191,148,255,0.95)}
.nav-item.owner-nav.active{background:rgba(124,58,237,0.14);color:#b388ff;border-color:rgba(124,58,237,0.25)}
.nav-item.owner-nav.active::before{background:#b388ff}
.nav-icon{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.sb-user{flex-shrink:0;padding:13px 18px;border-top:1px solid rgba(255,255,255,0.07);background:rgba(0,0,0,0.25);cursor:pointer}
.sb-uinfo{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.sb-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;background:var(--accent-dim);color:var(--accent);border:1px solid rgba(255,255,255,0.12)}
.sb-name{font-size:13px;font-weight:700;color:#fff}
.sb-role{font-size:9.5px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:.08em}
.btn-logout{width:100%;padding:8px;background:transparent;border:1px solid rgba(255,255,255,0.12);border-radius:var(--radius-sm);color:rgba(255,255,255,0.4);font-size:10.5px;transition:all .2s;letter-spacing:.05em;text-transform:uppercase;font-family:var(--font-body)}
.btn-logout:hover{border-color:var(--danger);color:var(--danger);background:rgba(229,57,53,0.1)}
@media(min-width:880px){
  .sidebar{display:flex}
  .topbar{padding:14px 28px}
  .topbar #tb-mark,.topbar .nm{display:none}
  .live-badge{display:flex}
  .pg-title{display:inline}
  #shell{margin-left:230px}
  .tabs{display:none}
  .main{padding:26px 28px 40px}
}
/* ---------- bottom tabs (mobile) ---------- */
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(0,0,0,0.05)}
.tab{flex:1;padding:9px 4px 8px;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.tab .ic{font-size:19px}
.tab.on{color:var(--accent-dark)}
/* ---------- cards & bits ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.h1{font-family:var(--font-display);font-size:19px;font-weight:900;margin:4px 0 14px;letter-spacing:.6px;text-transform:uppercase}
.h2{font-family:var(--font-display);font-size:11px;font-weight:800;color:var(--accent-dark);margin:0 0 10px;letter-spacing:.14em;text-transform:uppercase}
.btn{border:1px solid var(--line);background:var(--bg-hover);border-radius:var(--radius-sm);padding:9px 15px;font-weight:700;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;transition:all .18s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-dim)}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(37,211,102,0.25)}
.btn.p:hover{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff}
.btn.g{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff}
.btn.g:hover{background:var(--accent-dark);color:#fff}
.btn.sm{padding:5px 11px;font-size:10px;border-radius:7px}
.btn.danger{color:var(--danger);border-color:rgba(229,57,53,0.25);background:var(--danger-dim)}
.btn.danger:hover{background:rgba(229,57,53,0.15);color:var(--danger);border-color:rgba(229,57,53,0.4)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inp{padding:10px 12px;border-radius:var(--radius-sm);border:1.5px solid var(--line);background:var(--bg-input);width:100%}
.inp:focus{outline:none;border-color:var(--accent)}
.lbl{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin:10px 0 4px;display:block;font-family:var(--font-display)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px;background:var(--bg-input);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em;white-space:nowrap;font-family:var(--font-display);font-weight:800}
td{padding:8px;border-top:1px solid var(--line);vertical-align:middle}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:3px 10px;font-size:10px;font-weight:700;letter-spacing:.06em;border:1px solid transparent}
.pill.on{background:var(--accent-dim);color:var(--accent-dark);border-color:rgba(37,211,102,0.22)}
.pill.off{background:var(--danger-dim);color:var(--danger);border-color:rgba(229,57,53,0.2)}
.dept{display:inline-block;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;color:#fff}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 14px;text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:all .2s}
.tile::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:rgba(37,211,102,0.25)}
.tile .ic{font-size:30px}
.tile .t{font-family:var(--font-display);font-weight:800;margin-top:8px}
.tile .s{font-size:11.5px;color:var(--muted);margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:880px){.grid2{grid-template-columns:repeat(3,1fr)}}
.soon{opacity:.55}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--bar);color:#e8f5e9;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.3);border:1px solid rgba(37,211,102,0.3)}
@media(min-width:880px){.toast{bottom:34px}}
/* ---------- chat ---------- */
.cl-item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow);transition:all .18s}
.cl-item:hover{border-color:rgba(37,211,102,0.3)}
.cl-av{width:44px;height:44px;border-radius:50%;background:var(--accent-dark);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.cl-av.g{background:var(--accent2);border-radius:12px}
.cl-mid{flex:1;min-width:0}
.cl-t{font-weight:800;font-size:14.5px}
.cl-s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.cl-right{text-align:right;flex:none}
.cl-time{font-size:11px;color:var(--muted)}
.cl-badge{background:var(--accent);color:#fff;border-radius:12px;font-size:11px;font-weight:800;padding:1px 7px;display:inline-block;margin-top:4px}
#conv{position:fixed;inset:0;background:var(--paper);z-index:30;display:flex;flex-direction:column}
@media(min-width:880px){#conv{left:230px}}
.cv-head{background:var(--bar);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px}
.cv-back{border:none;background:none;color:#fff;font-size:22px;padding:2px 6px}
.cv-t{font-weight:800;font-size:15px;font-family:var(--font-display)}
.cv-s{font-size:11px;color:rgba(232,245,233,0.55)}
.cv-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:78%;padding:8px 11px;border-radius:14px;font-size:14px;line-height:1.4;position:relative;word-wrap:break-word}
.bub.me{align-self:flex-end;background:#dcf8c6;border:1px solid #c8ecb0;border-bottom-right-radius:4px}
.bub.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.sys{align-self:center;background:#fcf4cb;color:#8a6d1a;font-size:11.5px;border-radius:10px;padding:4px 12px}
.bub .snd{font-size:11px;font-weight:800;color:var(--accent-dark);margin-bottom:2px}
.bub .meta{font-size:10px;color:var(--muted);text-align:right;margin-top:3px;display:flex;gap:4px;justify-content:flex-end;align-items:center}
.tick{font-size:11px}.tick.read{color:var(--accent2);font-weight:800}
.bub img{max-width:100%;border-radius:10px;display:block}
.bub audio{width:210px;max-width:100%}
.doccard{display:flex;gap:8px;align-items:center;background:var(--bg-input);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
.cv-comp{background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end}
.cv-inp{flex:1;border:1.5px solid var(--line);border-radius:20px;padding:10px 14px;font-size:15px;max-height:110px;resize:none;background:var(--bg-input)}
.cv-btn{width:44px;height:44px;border-radius:50%;border:none;font-size:19px;flex:none;display:grid;place-items:center}
.cv-send{background:var(--accent);color:#fff}
.cv-attach{background:var(--bg-secondary)}
.cv-mic{background:var(--accent-dark);color:#fff}
.cv-mic.rec{background:var(--stop);animation:micpulse 1s infinite}
@keyframes micpulse{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
.attach-menu{position:absolute;bottom:64px;left:10px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.15);overflow:hidden;z-index:35}
.attach-menu button{display:flex;gap:10px;align-items:center;width:100%;border:none;background:none;padding:12px 18px;font-size:14px;font-weight:600}
.fab{position:fixed;right:18px;bottom:86px;width:56px;height:56px;border-radius:50%;border:none;background:var(--fab);color:#fff;font-size:26px;box-shadow:0 6px 24px rgba(37,211,102,0.45);z-index:25}
@media(min-width:880px){.fab{bottom:30px}}
/* ---------- camera & preview ---------- */
#cam-live{width:100%;max-height:52vh;background:#000;border-radius:12px}
.cam-bar{display:flex;justify-content:center;gap:18px;margin-top:12px}
.cam-shutter{width:64px;height:64px;border-radius:50%;border:4px solid #fff;background:var(--accent);box-shadow:0 4px 16px rgba(0,0,0,.3);cursor:pointer}
.cam-shutter.rec{background:var(--stop);animation:micpulse 1s infinite}
.pv-media img,.pv-media video{width:100%;max-height:48vh;border-radius:12px;object-fit:contain;background:#000}
/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(13,31,13,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
@media(min-width:640px){.overlay{align-items:center}}
.modal{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:18px;box-shadow:var(--shadow-md)}
@media(min-width:640px){.modal{border-radius:18px}}
.m-h{display:flex;align-items:center;margin-bottom:10px}
.m-h b{font-size:15px;font-family:var(--font-display);font-weight:800;letter-spacing:.4px;text-transform:uppercase}
.m-x{margin-left:auto;border:none;background:none;font-size:22px;color:var(--muted)}
.chk{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--bg-secondary);font-size:13.5px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.switchrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bg-secondary)}
/* D5.0b hotfix: bottom tabs are phones-only — re-assert after the base rule */
@media(min-width:880px){.tabs{display:none}}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <div class="lg-top">
    <div class="lg-brand"><span id="lg-mark"></span> Future Makers</div>

<script>
const API = window.FM_CONFIG.API_BASE;
const sb = supabase.createClient(window.FM_CONFIG.SUPABASE_URL, window.FM_CONFIG.SUPABASE_ANON_KEY);
const FM_MARK = (size=34, opts={}) => {
  const { tile=true, glyph='#fff', tileColor='#25d366' } = opts;
  const inner = `<svg width="${Math.round(size*0.62)}" height="${Math.round(size*0.62)}" viewBox="0 0 28 28" fill="none" style="display:block">
    <circle cx="9" cy="14" r="3.2" fill="${tile?glyph:tileColor}"/>
    <path d="M14.5 8 a8 8 0 0 1 0 12" stroke="${tile?glyph:tileColor}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M18.5 4.5 a13 13 0 0 1 0 19" stroke="${tile?glyph:tileColor}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  </svg>`;
  if (!tile) return inner;
  return `<span style="width:${size}px;height:${size}px;border-radius:${Math.round(size*0.26)}px;background:${tileColor};display:inline-grid;place-items:center;flex:none">${inner}</span>`;
};
document.getElementById('lg-mark').innerHTML = FM_MARK(40);
document.getElementById('tb-mark').innerHTML = FM_MARK(30);

let S = { profile:null, features:{}, page:'home', users:[], depts:[], matrix:null, tk:{ view:'mine', pick:null, steps:[], filter:null, scoreDays:30 } };
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m, ms){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(), ms || (String(m).startsWith('⚠')?4500:2600)); }

async function token(){ const { data } = await sb.auth.getSession(); return data?.session?.access_token || null; }
async function api(path, opts={}){
  const t = await token();
  const headers = { ...(opts.headers||{}) };
  if (!(opts.body instanceof FormData)) headers['Content-Type']='application/json';
  if (t) headers['Authorization'] = 'Bearer '+t;
  // D4.2: a sleeping free-tier server used to mean an infinite silent
  // hang. Now every call has a deadline and a message that says what
  // is actually happening.
  const ctrl = new AbortController();
  const killer = setTimeout(()=>ctrl.abort(), opts.timeoutMs || 30000);
  let res;
  try {
    res = await fetch(API+path, { ...opts, headers, signal: ctrl.signal,
      body: opts.body instanceof FormData ? opts.body : (opts.body ? JSON.stringify(opts.body) : undefined) });
  } catch(e){
    clearTimeout(killer);
    if (e.name === 'AbortError')
      throw new Error('Server is waking up (free hosting sleeps when idle) — wait ~1 minute and try again');
    throw new Error('Cannot reach the server — check your internet connection');
  }
  clearTimeout(killer);
  let j = {}; try { j = await res.json(); } catch {}
  if (!res.ok) throw new Error(j.error || ('Server error HTTP '+res.status));
  return j;
}

// ---------------- auth ----------------
async function doLogin(){
  const code = document.getElementById('lg-code').value.trim();
  const pass = document.getElementById('lg-pass').value;
  const err = document.getElementById('lg-err'); err.textContent='';
  if (!code || !pass) { err.textContent='Enter your code and password.'; return; }
  const btn = document.querySelector('.lg-btn');
  if (btn){ btn.disabled = true; btn.textContent = 'Signing in…'; }
  const ctrl = new AbortController();
  const killer = setTimeout(()=>ctrl.abort(), 30000);
  try {
    const r = await fetch(API+'/api/fm/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ code, password: pass }), signal: ctrl.signal });
    clearTimeout(killer);
    const j = await r.json();
    if (!r.ok) { err.textContent = j.error || 'Login failed'; return; }
    await sb.auth.setSession({ access_token: j.session.access_token, refresh_token: j.session.refresh_token });
    S.profile = j.profile; S.features = j.features;
    enterApp();
  } catch(e){
    clearTimeout(killer);
    err.textContent = e.name==='AbortError'
      ? 'The server is waking up (free hosting sleeps when idle). Wait ~1 minute, then try again.'
      : 'Cannot reach server — check internet and try again.';
  } finally {
    if (btn){ btn.disabled = false; btn.textContent = 'Sign in'; }
  }
}
async function tryResume(){
  const t = await token();
  if (!t) return false;
  try { const j = await api('/api/fm/auth/me'); S.profile=j.profile; S.features=j.features; return true; }
  catch { await sb.auth.signOut(); return false; }
}
async function doLogout(){ await sb.auth.signOut(); location.reload(); }

function enterApp(){
  document.getElementById('login').classList.add('hide');
  document.getElementById('shell').classList.remove('hide');
  document.getElementById('tb-name').textContent = S.profile.name;
  document.getElementById('tb-role').textContent = S.profile.platform_role.replace('_',' ');
  // D4.3 — WatchOwl sidebar identity
  const mk = document.getElementById('sb-mark');
  if(mk) mk.innerHTML = FM_MARK(30, { tile:false, glyph:'#25d366' });
  const av = document.getElementById('sb-av');
  if(av) av.textContent = S.profile.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const nm = document.getElementById('sb-name'); if(nm) nm.textContent = S.profile.name;
  const rl = document.getElementById('sb-role'); if(rl) rl.textContent = S.profile.platform_role.replace('_',' ');
  ensureRealtime();   // D4.1: was only wired on first Chat visit — SLA alerts need it from login
  renderTabs(); go('home');
}

// ---------------- nav ----------------
const isAdmin = () => ['super_admin','admin'].includes(S.profile?.platform_role);
function renderTabs(){
  const tabs = [
    { id:'home', ic:'🏠', t:'Home' },
    { id:'chat', ic:'💬', t:'Chat' },
    { id:'broadcast', ic:'📣', t:'Broadcast' },
    { id:'tasks', ic:'✅', t:'Tasks' },
    ...(S.features?.meetings_join ? [{ id:'meetings', ic:'📅', t:'Meetings' }] : []),
    ...(isAdmin() ? [{ id:'admin', ic:'🛠', t:'Admin' }] : []),
    { id:'profile', ic:'👤', t:'Me' },
  ];
  document.getElementById('tabs').innerHTML = tabs.map(x =>
    `<button class="tab ${S.page===x.id?'on':''}" onclick="${x.soon?`toast('${x.t} arrives in the next stage')`:`go('${x.id}')`}">
      <span class="ic">${x.ic}</span>${x.t}</button>`).join('');

  // WatchOwl sidebar — same tabs, sectioned the WatchOwl way
  const nav = document.getElementById('side-nav');
  if(nav){
    const item = (x, cls='') =>
      `<button class="nav-item ${cls} ${S.page===x.id?'active':''}" onclick="go('${x.id}')">
        <span class="nav-icon">${x.ic}</span> ${x.t}</button>`;
    const byId = Object.fromEntries(tabs.map(x=>[x.id,x]));
    const sec = (label, ids, cls='') => {
      const items = ids.filter(id=>byId[id]).map(id=>item(byId[id], cls)).join('');
      return items ? `<div class="nav-section"><div class="nav-label">${label}</div>${items}</div>` : '';
    };
    nav.innerHTML =
      sec('Workspace', ['home','chat','broadcast','tasks','meetings']) +
      sec('Admin', ['admin'], 'owner-nav') +
      sec('Account', ['profile']);
  }
  const pt = document.getElementById('pg-title');
  if(pt){ const cur = tabs.find(x=>x.id===S.page); pt.textContent = cur ? cur.t : ''; }
  const cr = document.getElementById('sb-create');
  if(cr) cr.style.display = S.features?.tasks_create ? 'block' : 'none';
}
function go(p){ S.page=p; renderTabs(); ({home:renderHome, admin:renderAdmin, profile:renderProfile, chat:renderChat, broadcast:renderBroadcast, tasks:renderTasks, meetings:renderMeetings}[p]||renderHome)(); }

      <div class="tile" onclick="go('broadcast')" style="cursor:pointer"><div class="ic">📣</div><div class="t">${f.broadcast_create?'Broadcasts':'Announcements'}</div><div class="s">Instructions · schedule · tracking</div></div>
      ${f.tasks_view ? `<div class="tile" onclick="go('tasks')" style="cursor:pointer"><div class="ic">✅</div><div class="t">Tasks</div><div class="s">Steps · SLA · accountability</div></div>`:''}
      ${f.meetings_join ? `<div class="tile" onclick="go('meetings')" style="cursor:pointer"><div class="ic">📅</div><div class="t">Meetings</div><div class="s">Schedule · remind · join</div></div>`:''}
      ${isAdmin() ? `<div class="tile" onclick="go('admin')" style="cursor:pointer;border-color:var(--signal)"><div class="ic">🛠</div><div class="t">Admin</div><div class="s">Users · Departments · Access</div></div>`:''}
      ${tile('🛰','Platform','Stage D1 live — foundation running',0)}
    </div>
    <div class="card" style="margin-top:14px">
      <div class="h2">Your access</div>
      <div style="font-size:13px;color:var(--muted);line-height:1.7">
        ${Object.entries(f).filter(([k,v])=>v===true).map(([k])=>`<span class="pill on" style="margin:2px 3px 2px 0">${k.replace(/_/g,' ')}</span>`).join('')}

async function loadAdmin(){
  const [u, d, m] = await Promise.all([ api('/api/fm/users'), api('/api/fm/departments'), api('/api/fm/matrix') ]);
  S.users=u.users||[]; S.depts=d.departments||[]; S.matrix=m;

          <td style="white-space:nowrap"><button class="btn sm" onclick="openUser('${u.id}')">Edit</button></td>

    </div>

        <div class="h2" style="margin:0">Departments</div>
        <button class="btn sm p" onclick="openDept()">+ Add</button>
      </div>
      <div style="margin-top:8px">${S.depts.map(d=>`
        <div class="switchrow"><div><span class="dept" style="background:${d.color}">${esc(d.name)}</span>
          <span style="font-size:11.5px;color:var(--muted);margin-left:8px">SLA ${d.sla_hours}h</span></div>

// ----- user modal -----
function modal(html){ document.getElementById('modal-root').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

const FEATS = [['chat_direct','1-to-1 chat'],['chat_groups','Group chat'],['groups_create','Create groups'],['broadcast_create','Create broadcasts'],['broadcast_email','Email channel'],['tasks_view','See tasks'],['tasks_create','Create tasks'],['meetings_join','Join meetings'],['meetings_schedule','Schedule meetings'],['reports_view','Reports'],['media_video','Send video'],['media_voice','Send voice notes']];

function openUser(id){
  const u = id ? S.users.find(x=>x.id===id) : null;
  const superMe = S.profile.platform_role==='super_admin';
  const eff = u ? u.features||{} : {};
  modal(`
    <div class="m-h"><b>${u?'Edit user':'Add user'}</b><button class="m-x" onclick="closeModal()">×</button></div>
    <label class="lbl">Employee code</label><input id="u-code" class="inp" value="${esc(u?.code||'')}" ${u?'disabled':''}/>
    <label class="lbl">Name</label><input id="u-name" class="inp" value="${esc(u?.name||'')}"/>
    <label class="lbl">Phone</label><input id="u-phone" class="inp" value="${esc(u?.phone||'')}"/>
    <label class="lbl">Email (for email broadcasts)</label><input id="u-email" class="inp" value="${esc(u?.email||'')}"/>
    <label class="lbl">Department</label>
    <select id="u-dept" class="inp"><option value="">—</option>${S.depts.map(d=>`<option value="${d.id}" ${u?.department_id===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select>
    <label class="lbl">Platform role ${superMe?'':'(owner only)'}</label>
    <select id="u-role" class="inp" ${superMe?'':'disabled'}>${['employee','broadcaster','admin','super_admin'].map(r=>`<option ${u?.platform_role===r?'selected':''}>${r}</option>`).join('')}</select>
    <label class="lbl">Task role (WatchOwl)</label>
    <select id="u-task" class="inp"><option value="">—</option>${['worker','manager','reviewer'].map(r=>`<option ${u?.task_role===r?'selected':''}>${r}</option>`).join('')}</select>
    ${!u?`<label class="lbl">Password (you set it)</label><input id="u-pass" class="inp" placeholder="min 6 characters"/>`:''}
    ${u&&superMe?`
      <label class="lbl" style="margin-top:14px">Feature overrides (leave unticked-state = role default)</label>
      <div style="font-size:11.5px;color:var(--muted);margin-bottom:4px">Ticked = force ON · use “role default” to clear</div>
      ${FEATS.map(([k,label])=>`
        <div class="chk"><input type="checkbox" id="f-${k}" ${eff[k]===true?'checked':''}/>
          <span style="flex:1">${label}</span>
          ${k in eff?`<button class="btn sm" onclick="delete this.dataset.x;document.getElementById('f-${k}').indeterminate=false;document.getElementById('f-${k}').dataset.cleared='1';document.getElementById('f-${k}').checked=false;this.textContent='cleared'">role default</button>`:'<span style="font-size:11px;color:var(--muted)">role default</span>'}
        </div>`).join('')}`:''}
    <div class="row" style="margin-top:16px;justify-content:flex-end">
      ${u?`<button class="btn" onclick="resetPass('${u.id}','${esc(u.code)}')">Reset password</button>
           <button class="btn ${u.is_active?'danger':''}" onclick="toggleActive('${u.id}',${u.is_active})">${u.is_active?'Deactivate':'Activate'}</button>`:''}
      <button class="btn p" onclick="saveUser('${u?u.id:''}')">${u?'Save':'Create'}</button>
    </div>`);
}
async function saveUser(id){
  const v = x => document.getElementById(x)?.value?.trim();
  try {
    if (!id) {
      await api('/api/fm/users', { method:'POST', body:{ code:v('u-code'), name:v('u-name'), phone:v('u-phone'), email:v('u-email'),
        department_id: v('u-dept')?Number(v('u-dept')):null, platform_role:v('u-role'), task_role:v('u-task')||null, password:v('u-pass') }});
      toast('User created');
    } else {
      const body = { name:v('u-name'), phone:v('u-phone'), email:v('u-email'),
        department_id: v('u-dept')?Number(v('u-dept')):null, task_role:v('u-task')||null };
      if (S.profile.platform_role==='super_admin') {
        body.platform_role = v('u-role');
        const features = {};
        for (const [k] of FEATS) {
          const el = document.getElementById('f-'+k); if (!el) continue;
          if (el.dataset.cleared==='1') continue;         // cleared → role default
          const orig = (S.users.find(x=>x.id===id)?.features)||{};
          if (el.checked) features[k]=true;
          else if (k in orig) features[k]=false;          // explicit off only if previously overridden
        }
        body.features = features;
      }
      await api('/api/fm/users/'+id, { method:'PATCH', body });
      // D4.1: task_role has its own authoritative endpoint (the D1
      // users PATCH may whitelist it away — that was the Table Editor
      // workaround). Same value both ways, so the double write is safe.
      await api('/api/fm/tasks/roles/'+id, { method:'PUT', body:{ task_role: v('u-task')||null } });
      toast('Saved');
    }
    closeModal(); renderAdmin();
  } catch(e){ toast('⚠ '+e.message); }
}
async function resetPass(id, code){
  const p = prompt(`New password for ${code} (min 6 chars):`);
  if (!p) return;
  try { await api(`/api/fm/users/${id}/reset-password`, { method:'POST', body:{ password:p } }); toast('Password reset'); }
  catch(e){ toast('⚠ '+e.message); }
}
async function toggleActive(id, cur){
  try { await api('/api/fm/users/'+id, { method:'PATCH', body:{ is_active: !cur } }); toast(cur?'Deactivated':'Activated'); closeModal(); renderAdmin(); }
  catch(e){ toast('⚠ '+e.message); }
}

function openImport(){
  modal(`
    <div class="m-h"><b>Import employees from Excel</b><button class="m-x" onclick="closeModal()">×</button></div>
    <div style="font-size:13px;color:var(--muted);line-height:1.6">Columns (flexible headers): <b>Code · Name · Contact · Email · Department</b>.<br/>New departments are created automatically. Everyone gets the default password below (they can change it in the app).</div>
    <label class="lbl">Excel file</label><input id="im-file" type="file" accept=".xlsx,.xls" class="inp"/>
    <label class="lbl">Default password for all</label><input id="im-pass" class="inp" placeholder="min 6 characters"/>
    <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn p" onclick="doImport()">Import</button></div>
    <div id="im-out" style="margin-top:10px;font-size:13px"></div>`);
}
async function doImport(){
  const f = document.getElementById('im-file').files[0];
  const p = document.getElementById('im-pass').value.trim();
  const out = document.getElementById('im-out');
  if (!f || !p) { out.textContent='Pick a file and set the default password.'; return; }
  const fd = new FormData(); fd.append('file', f); fd.append('default_password', p);
  out.textContent='Importing…';
  try {
    const r = await api('/api/fm/users/import', { method:'POST', body: fd });
    out.innerHTML = `✅ Created <b>${r.created}</b>` +
      (r.failed.length?`<br/>⚠ Failed ${r.failed.length}: ${r.failed.map(x=>esc(x.code+' ('+x.reason+')')).join(', ')}`:'') +
      (r.skipped.length?`<br/>↷ Skipped ${r.skipped.length}`:'');
    renderAdmin();
  } catch(e){ out.textContent='⚠ '+e.message; }
}

function openDept(id){

      <button class="btn p" onclick="saveDept(${d?d.id:'null'})">${d?'Save':'Create'}</button></div>`);

// D4.2 — the diagnostic that ends "is it me or the server?" forever.
async function pingHealth(){
  const el = document.getElementById('hc-line'); if(!el) return;
  el.textContent = 'Checking…';
  const t0 = Date.now();
  const ctrl = new AbortController();
  const killer = setTimeout(()=>ctrl.abort(), 65000);
  try {
    const r = await fetch(API+'/health', { signal: ctrl.signal, cache:'no-store' });
    clearTimeout(killer);
    const ms = Date.now()-t0;
    el.innerHTML = r.ok
      ? `<b style="color:var(--go)">✅ Awake</b> · responded in ${ms<1000?ms+' ms':(ms/1000).toFixed(1)+' s'}${ms>5000?' <span style="color:var(--muted)">(it was asleep — it is warm now, retry whatever failed)</span>':''}`
      : `<b style="color:var(--stop)">⚠ Reachable but unhealthy</b> · HTTP ${r.status} — check the Render logs`;
  } catch(e){
    clearTimeout(killer);
    el.innerHTML = e.name==='AbortError'
      ? `<b style="color:var(--stop)">⏳ No answer in 65 s</b> — the Render service looks down, not just asleep. Check the Render dashboard.`
      : `<b style="color:var(--stop)">✘ Unreachable</b> — check your internet, then the Render dashboard.`;
  }
}

function paintMsgs(){
  const box = document.getElementById('cv-msgs'); if(!box) return;
  box.innerHTML = S.chat.msgs.map(m=>{
    if(m.kind==='system') return `<div class="bub sys">${esc(m.body||'')}</div>`;
    const mine = m.sender_id===S.profile.id;
    const who = mine?'':(S.chat.active.kind==='group'?`<div class="snd">${esc(m.fm_users?.name||dirName(m.sender_id))}</div>`:'');
    let content = '';
    if(m.kind==='text') content = esc(m.body||'').replace(/\n/g,'<br/>');
    else if(m.kind==='image') content = `<img data-media="${esc(m.media_path)}" alt="photo"/>` + (m.body?`<div>${esc(m.body)}</div>`:'');
    else if(m.kind==='video') content = `<div class="doccard" onclick="openMedia('${esc(m.media_path)}')">🎥 <b>${esc(m.media_name||'Video')}</b></div>` + (m.body?`<div style="margin-top:4px">${esc(m.body)}</div>`:'');
    else if(m.kind==='audio') content = `<audio controls preload="none" data-audio="${esc(m.media_path)}"></audio>`;
    else content = `<div class="doccard" onclick="openMedia('${esc(m.media_path)}')">📄 <b style="word-break:break-all">${esc(m.media_name||'File')}</b></div>` + (m.body?`<div style="margin-top:4px">${esc(m.body)}</div>`:'');
    const tick = mine?`<span class="tick ${readByAll(m)?'read':''}">${readByAll(m)?'✓✓':'✓'}</span>`:'';
    const del = mine?`<span style="cursor:pointer;color:var(--muted)" title="Delete for everyone" onclick="delMsg('${m.id}')">🗑</span>`:'';
    return `<div class="bub ${mine?'me':'them'}">${who}${content}<div class="meta">${del} ${tfmt(m.created_at)} ${tick}</div></div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
  box.querySelectorAll('[data-media]').forEach(async img=>{ img.src = await mediaUrl(img.dataset.media); });
  box.querySelectorAll('[data-audio]').forEach(async a=>{ a.src = await mediaUrl(a.dataset.audio); });

let camStream=null, camRec=null, camChunks=[];
async function openCamera(kind){
  toggleAttach();
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }, audio: kind==='video',
    });
  } catch { toast('Camera permission needed — allow it in the browser and try again'); return; }
  modal(`
    <div class="m-h"><b>${kind==='video'?'Record video':'Take photo'}</b><button class="m-x" onclick="closeCamera()">×</button></div>
    <video id="cam-live" autoplay playsinline muted></video>
    <div class="cam-bar">
      <button class="cam-shutter" id="cam-btn" title="${kind==='video'?'Start / stop recording':'Capture'}"></button>
    </div>
    <div style="text-align:center;font-size:12px;color:var(--muted);margin-top:6px">${kind==='video'?'Tap the button to start, tap again to stop':'Tap the button to capture'}</div>`);
  document.getElementById('cam-live').srcObject = camStream;
  const btn = document.getElementById('cam-btn');
  if(kind==='image'){
    btn.onclick = () => {
      const v = document.getElementById('cam-live');
      const c = document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight;
      c.getContext('2d').drawImage(v,0,0);
      c.toBlob(b => { closeCamera(); if(b) openPreview('image', b, 'photo.jpg', 'image/jpeg'); }, 'image/jpeg', 0.9);
    };
  } else {
    btn.onclick = () => {
      if(!camRec){
        camChunks=[]; camRec = new MediaRecorder(camStream);
        camRec.ondataavailable = e=>camChunks.push(e.data);
        camRec.onstop = () => {
          const b = new Blob(camChunks,{type:'video/webm'});
          closeCamera(); if(b.size>1000) openPreview('video', b, 'video.webm', 'video/webm');
        };
        camRec.start(); btn.classList.add('rec');
      } else { camRec.stop(); camRec=null; }
    };
  }
}
function closeCamera(){
  if(camRec){ try{camRec.stop();}catch{} camRec=null; }
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  closeModal();
}

// ---------- preview before send ----------
let pending=null;
function openPreview(kind, blob, name, type){
  pending = { kind, blob, name, type };
  const url = URL.createObjectURL(blob);
  const inner =
    kind==='image' ? `<div class="pv-media"><img src="${url}"/></div>` :
    kind==='video' ? `<div class="pv-media"><video src="${url}" controls playsinline></video></div>` :
    `<div class="doccard" style="margin:6px 0">📄 <b style="word-break:break-all">${esc(name)}</b> <span style="color:var(--muted);font-size:12px">${(blob.size/1024/1024).toFixed(1)} MB</span></div>`;
  modal(`
    <div class="m-h"><b>Send ${kind}</b><button class="m-x" onclick="cancelPreview()">×</button></div>
    ${inner}
    <input class="inp" id="pv-cap" placeholder="Add a caption (optional)" style="margin-top:10px"/>
    <div class="row" style="margin-top:12px;justify-content:flex-end">
      <button class="btn" onclick="cancelPreview()">Cancel</button>
      <button class="btn p" onclick="confirmSend()">Send ➤</button>
    </div>`);
}
function cancelPreview(){ pending=null; closeModal(); }
async function confirmSend(){
  if(!pending) return;
  const { kind, blob, name, type } = pending;
  const caption = document.getElementById('pv-cap')?.value?.trim() || '';
  pending=null; closeModal(); toast('Sending…');
  try {
    let data, content_type = type || 'application/octet-stream';
    if(kind==='image'){ data = await compressImage(blob); content_type='image/jpeg'; }
    else { data = await fileToB64(blob); }
    const up = await api('/api/fm/chat/media',{method:'POST',body:{conversation_id:S.chat.active.id,kind,name,data,content_type}});
    const j = await api('/api/fm/chat/conversations/'+S.chat.active.id+'/messages',{method:'POST',
      body:{kind,body:caption||null,media_path:up.path,media_name:name,media_size:up.size}});
    pushLocal(j.message);
  } catch(e){ toast('⚠ '+e.message); }
}
async function fileToB64(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(file); });
}
async function compressImage(file){
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 1600/Math.max(bmp.width,bmp.height));
  const c = document.createElement('canvas'); c.width=Math.round(bmp.width*scale); c.height=Math.round(bmp.height*scale);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.8).split(',')[1];
}
async function sendMedia(kind, file, blobOverride){ // voice notes only
  toast('Sending…');
  try {
    const name = file?.name || (kind+'.webm');
    const data = await fileToB64(blobOverride || file);
    const up = await api('/api/fm/chat/media',{method:'POST',body:{conversation_id:S.chat.active.id,kind,name,data,content_type:file?.type||'audio/webm'}});
    const j = await api('/api/fm/chat/conversations/'+S.chat.active.id+'/messages',{method:'POST',

// ----- voice notes (hold to record) -----
let rec=null, recChunks=[];
function wireMic(){
  const btn = document.getElementById('cv-mic'); if(!btn) return;
  const start = async e => { e.preventDefault();
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      recChunks=[]; rec = new MediaRecorder(stream);
      rec.ondataavailable = ev=>recChunks.push(ev.data);
      rec.onstop = () => {
        stream.getTracks().forEach(t=>t.stop());
        const blob = new Blob(recChunks,{type:'audio/webm'});
        if(blob.size>1200) sendMedia('audio', {name:'voice-note.webm', type:'audio/webm'}, blob);
      };
      rec.start(); btn.classList.add('rec');
    } catch { toast('Microphone permission needed'); }
  };
  const stop = e => { e.preventDefault(); if(rec&&rec.state!=='inactive'){ rec.stop(); } btn.classList.remove('rec'); };
  btn.addEventListener('mousedown',start); btn.addEventListener('touchstart',start,{passive:false});
  btn.addEventListener('mouseup',stop); btn.addEventListener('mouseleave',stop); btn.addEventListener('touchend',stop);
}

// ----- realtime -----
function ensureRealtime(){
  if(S.chat.sub) return; S.chat.sub = true;
  sb.channel('fm-chat')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'fm_meetings'}, payload => {
      if(payload.new?.created_by!==S.profile.id) toast('📅 You are invited: '+(payload.new?.title||'a meeting'), 5000);
      if(S.page==='meetings') renderMeetings();
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'fm_meetings'}, payload => {
      if(payload.new?.status==='live' && payload.old?.status!=='live'){
        toast('📅 Live now: '+(payload.new?.title||'meeting')+' — join from Meetings', 6000);
      }
      if(S.page==='meetings') renderMeetings();
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'fm_task_events'}, payload => {
      const k = payload.new?.kind;
      if(k==='activated' && payload.new?.actor_id!==S.profile.id) toast('✅ A task step is waiting');
      if(k==='escalated'){
        const mine=(payload.new?.detail?.assignee_ids||[]).includes(S.profile.id);
        toast(mine?'⏰ Your step is overdue — the task is blocked':'⏰ A task step went overdue', mine?6000:3000);
      }
      if(S.page==='tasks'){
        if(S.tk.view==='mine') paintMine();
        else if(S.tk.view==='all') paintAllTasks();
        if(S.tk.openTask===payload.new?.task_id && document.getElementById('tk-detail')) openTask(S.tk.openTask, true);
      }
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'fm_broadcast_receipts'}, payload => {
      if(payload.new?.user_id===S.profile.id){
        toast('📣 New broadcast received');
        if(S.page==='broadcast' && S.bc.view==='inbox') paintInbox();
      }
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'fm_messages'}, payload => {
      const id = payload.old?.id; if(!id) return;
      const had = S.chat.msgs.find(x=>x.id===id);
      if(had){ S.chat.msgs = S.chat.msgs.filter(x=>x.id!==id); paintMsgs(); }
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'fm_messages'}, payload => {
      const m = payload.new;
      if(S.chat.active && m.conversation_id===S.chat.active.id){
        pushLocal(m);
        api('/api/fm/chat/conversations/'+m.conversation_id+'/read',{method:'POST'}).catch(()=>{});
      } else if(S.page==='chat' && !S.chat.active){
        renderChat();
      } else if(m.sender_id!==S.profile.id){
        toast('💬 New message');
      }
    })
    .subscribe();
}

// D4.2: failures used to be a 2.6-second toast that vanished behind a
// busy thumb. Now every failure ALSO lands in a red box inside the
// composer that stays until the next attempt.
// ---------------- BROADCAST DIAGNOSTIC (D5.0c) ----------------
// One click. Tests the whole pipeline and prints every step on
// screen. Step 5 performs a REAL send-now broadcast (in-app only)
// so a full pass literally proves the system by using it.
async function bcDiag(){
  modal(`<div class="m-h"><b>🩺 Broadcast diagnostic</b><button class="m-x" onclick="closeModal()">✕</button></div>
    <div id="dg-out" style="font-family:ui-monospace,Consolas,monospace;font-size:13.5px;line-height:1.9"></div>
    <div id="dg-verdict" style="margin-top:14px;padding:12px;border-radius:10px;font-weight:800;display:none"></div>`);
  const out = document.getElementById('dg-out');
  const line = (icon, txt) => { const d=document.createElement('div'); d.textContent = icon+' '+txt; out.appendChild(d); return d; };
  const raw = (txt) => { const d=document.createElement('div'); d.style.cssText='background:var(--bg-input);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:2px 0 6px;word-break:break-all;white-space:pre-wrap;font-size:12px;color:var(--muted)'; d.textContent = txt; out.appendChild(d); };
  const verdict = (ok, txt) => { const v=document.getElementById('dg-verdict'); if(!v) return; v.style.display='block'; v.style.background = ok?'var(--accent-dim)':'var(--danger-dim)'; v.style.color = ok?'var(--accent-dark)':'var(--danger)'; v.style.border = ok?'1px solid rgba(37,211,102,0.3)':'1px solid rgba(229,57,53,0.3)'; v.textContent = txt; };
  const timed = (p, ms) => Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('TIMED OUT after '+ms/1000+'s')), ms))]);

  line('▪', 'API base: ' + API);

  // 1 — server reachable, no auth
  let l = line('⏳', 'Step 1 · server /health …');
  try {
    const t0=Date.now(); const r = await timed(fetch(API+'/health',{cache:'no-store'}), 65000);
    l.textContent = (r.ok?'✔':'✘') + ` Step 1 · server /health → HTTP ${r.status} in ${Date.now()-t0} ms`;
    if(!r.ok){ verdict(false,'FAILED AT STEP 1 — the server is not healthy. Check Render.'); return; }
  } catch(e){ l.textContent='✘ Step 1 · server unreachable: '+e.message; verdict(false,'FAILED AT STEP 1 — cannot reach the server at all.'); return; }

  // 2 — login token
  l = line('⏳', 'Step 2 · your login token …');
  let tok = null;
  try {
    tok = await timed(token(), 10000);
    if(!tok){ l.textContent='✘ Step 2 · no login token — session is broken'; verdict(false,'FAILED AT STEP 2 — log out (Me → Sign out) and log in again, then re-run.'); return; }
    l.textContent = '✔ Step 2 · login token present ('+String(tok).length+' chars)';
  } catch(e){ l.textContent='✘ Step 2 · token retrieval '+e.message; verdict(false,'FAILED AT STEP 2 — the session refresh is stuck. Log out and log in again, then re-run.'); return; }
  const H = { 'Authorization':'Bearer '+tok, 'Content-Type':'application/json' };

  // 3 — the broadcasts route answers with auth
  l = line('⏳', 'Step 3 · route GET /api/fm/broadcasts/manage …');
  let existing = null;
  try {
    const r = await timed(fetch(API+'/api/fm/broadcasts/manage',{headers:H}), 30000);
    const b = await r.text();
    l.textContent = (r.ok?'✔':'✘') + ' Step 3 · manage list → HTTP ' + r.status;
    if(!r.ok){ raw(b.slice(0,400)); verdict(false, r.status===404 ? 'FAILED AT STEP 3 — the broadcast route is MISSING on the server (backend deploy problem).' : 'FAILED AT STEP 3 — the server rejected your access. The raw answer above is the reason.'); return; }
    try { existing = JSON.parse(b).broadcasts || []; } catch { existing = []; }
    line('▪', '   → you already have ' + existing.length + ' broadcast(s) on the server' + (existing.length?': "'+ (existing[0].title||'?') +'" is the newest':''));
  } catch(e){ l.textContent='✘ Step 3 · '+e.message; verdict(false,'FAILED AT STEP 3 — request died: '+e.message); return; }

  // 4 — feature flags as this login sees them
  line('▪', 'Step 4 · your features (login copy): broadcast_create='+(S.features.broadcast_create===true)+', broadcast_email='+(S.features.broadcast_email===true));

  // 5 — the real thing: create a send-now, in-app-only broadcast
  l = line('⏳', 'Step 5 · REAL create: POST /api/fm/broadcasts (send now, in-app only) …');
  try {
    const stamp = new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    const r = await timed(fetch(API+'/api/fm/broadcasts',{ method:'POST', headers:H, body: JSON.stringify({
      title:'DIAGNOSTIC '+stamp, body:'Automatic pipeline test — safe to ignore.', media:[],
      target_type:'all', target_id:null, target_label:'All employees',
      channels:{ inapp:true, email:false }, ack_required:false, send_mode:'now',
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Kolkata',
    })}), 45000);
    const b = await r.text();
    l.textContent = (r.ok?'✔':'✘') + ' Step 5 · create → HTTP ' + r.status;
    raw(b.slice(0,500));
    if(!r.ok){ verdict(false,'FAILED AT STEP 5 — THIS IS THE BUG. The raw server answer above is the exact reason. Screenshot this card.'); return; }
  } catch(e){ l.textContent='✘ Step 5 · '+e.message; verdict(false,'FAILED AT STEP 5 — request died mid-flight: '+e.message+'. Screenshot this card.'); return; }

  // 6 — confirm it landed
  l = line('⏳', 'Step 6 · re-checking the manage list …');
  try {
    const r = await timed(fetch(API+'/api/fm/broadcasts/manage',{headers:H}), 30000);
    const j = await r.json(); const n = (j.broadcasts||[]).length;
    l.textContent = '✔ Step 6 · server now has '+n+' broadcast(s)' + (existing!==null && n>existing.length ? ' — the new one LANDED':'');
  } catch(e){ l.textContent='▪ Step 6 · recheck skipped: '+e.message; }

  verdict(true,'ALL STEPS PASSED ✔ — a real broadcast was just created and sent in-app. The pipeline works end to end. Check the Inbox tab (and TEST01\'s screen) for "DIAGNOSTIC". Screenshot this card anyway.');
}

      return;
    }
    body.next_run_at = new Date(at).toISOString();
  }
  if(mode==='recur'){
    body.recur = { freq:document.getElementById('bc-freq').value,
      interval_days:Number(document.getElementById('bc-int').value)||1,
      time:document.getElementById('bc-time').value||'09:00',
      end_date:document.getElementById('bc-end').value||null };
  }
  const go = document.getElementById('bc-go');
  if(go){ if(go.disabled) return; go.disabled = true; go.textContent = 'Sending…'; }
  try {
    const r = await api('/api/fm/broadcasts',{method:'POST',body});
    toast(mode==='now' ? ('Sent to '+(r.fired?.recipients??0)+' people 🚀') : 'Broadcast scheduled ✔');
    closeModal(); S.bc.view='manage'; renderBroadcast();
  } catch(e){
    bcErr(e.message);
    if(go){ go.disabled = false; go.textContent = 'Create'; }
  }
 } catch(outer){
  // impossible-by-design, but if ANYTHING above ever throws, it surfaces
  bcErr('Unexpected: ' + outer.message);
 }
}

function mtWhen(iso){
  const d = new Date(iso), now = Date.now(), diff = d - now;
  const t = d.toLocaleString('en-IN',{ day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
  if (diff <= 0) return t;
  const m = Math.round(diff/60000);
  if (m < 60) return `${t} · in ${m} min`;
  if (m < 24*60) return `${t} · in ${Math.round(m/60)} h`;
  return t;
}

  : m.status==='ended' ? `<span class="pill" style="background:rgba(0,0,0,0.05);color:var(--muted)">Ended</span>`

const TK_PRI = { critical:['CRITICAL','var(--stop)'], high:['High','var(--signal)'], normal:['Normal','var(--muted)'], low:['Low','#8696A0'] };
const tkPri = p => { const [t,c]=TK_PRI[p]||TK_PRI.normal; return `<span style="font-size:11px;font-weight:800;color:${c}">${t}</span>`; };
const tkDue = d => {
  if(!d) return '';
  const ms = new Date(d) - Date.now(), h = Math.abs(ms)/36e5;
  const span = h>=48 ? Math.round(h/24)+'d' : h>=1 ? Math.round(h)+'h' : Math.max(1,Math.round(h*60))+'m';
  return ms<0 ? `<span style="color:var(--stop);font-weight:800">⏰ overdue by ${span}</span>`
              : `<span style="color:var(--muted)">due in ${span}</span>`;
};
const tkStatus = st => ({active:'<span class="pill on">Active</span>',

// authenticated file download — a plain <a href> can't carry the Bearer token
async function dlCsv(path, name){
  try {
    const t = await token();
    const r = await fetch(API+path, { headers:{ Authorization:'Bearer '+t } });
    if(!r.ok){ let j={}; try{ j=await r.json(); }catch{} throw new Error(j.error||('HTTP '+r.status)); }
    const u = URL.createObjectURL(await r.blob());
    const a = document.createElement('a'); a.href=u; a.download=name; a.click();
    setTimeout(()=>URL.revokeObjectURL(u), 4000);
  } catch(e){ toast('⚠ '+e.message, 5000); }
}

  };
  modal(`<div id="tk-detail">
    <div class="m-h"><b>${esc(t.title)}</b><button class="m-x" onclick="closeModal()">×</button></div>
    <div style="font-size:11.5px;color:var(--muted);margin-top:-4px;margin-bottom:6px">
      <span style="font-family:ui-monospace,monospace">${esc(t.ref)}</span> · ${tkPri(t.priority)} · ${tkStatus(t.status)}
      ${t.approved_at?` · <span style="color:var(--go);font-weight:700">approved</span>`:t.status==='completed'?' · awaiting review':''}</div>
    ${t.description?`<div style="font-size:13px;margin:8px 0;white-space:pre-wrap">${esc(t.description)}</div>`:''}
    <div class="h2" style="margin-top:10px">Steps</div>
    ${seqs.map(q=>{
      const group=steps.filter(x=>x.seq===q);
      return (group.length>1?`<div style="font-size:10.5px;color:var(--muted);margin-top:6px">▼ in parallel</div>`:'')+group.map(stepRow).join('');
    }).join('')}
    <div class="row" style="margin-top:12px;gap:8px">
      ${canApprove?`<button class="btn p" onclick="tkApprove('${t.id}')">Approve task</button>`:''}
      ${canCancel?`<button class="btn" style="color:var(--stop)" onclick="tkCancel('${t.id}')">Cancel task</button>`:''}
      <button class="btn sm" style="margin-left:auto" onclick="dlCsv('/api/fm/tasks/${t.id}/export.csv','${esc(t.ref)}_timeline.csv')">⬇ Timeline CSV</button>
    </div>
    <div class="h2" style="margin-top:14px">Timeline</div>
    <div style="max-height:180px;overflow:auto">
      ${ev.map(e=>`<div style="font-size:11.5px;color:var(--muted);padding:3px 0">
        ${tfmt(e.at)} · <b style="color:var(--ink)">${esc(e.fm_users?.name||'system')}</b> ${esc(e.kind)}
        ${e.detail?.step?` — ${esc(e.detail.step)}`:''}${e.detail?.reason?` · "${esc(e.detail.reason)}"`:''}${e.detail?.note?` · "${esc(e.detail.note)}"`:''}
      </div>`).join('')||'<div style="font-size:12px;color:var(--muted)">—</div>'}
    </div>
  </div>`);
  if(refresh===true){} // re-render path used by realtime
}

// ----- actions -----
function tkCompleteModal(taskId, stepId, name){
  modal(`<b style="font-size:15px">Mark done — ${name}</b>
    <textarea id="tk-note" class="inp" rows="3" placeholder="Note (optional): what was done, reference numbers…" style="margin-top:10px"></textarea>
    <div class="row" style="justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" onclick="closeModal()">Back</button>
      <button class="btn p" id="tk-done-go" onclick="tkComplete('${taskId}','${stepId}')">Mark done</button></div>`);
}
async function tkComplete(taskId, stepId){
  const go=document.getElementById('tk-done-go'); if(go){ if(go.disabled) return; go.disabled=true; go.textContent='Saving…'; }
  try {
    const r = await api(`/api/fm/tasks/${taskId}/steps/${stepId}/complete`,{method:'POST',body:{note:document.getElementById('tk-note')?.value.trim()||null}});
    toast(r.task_completed ? (r.awaiting_review?'Task complete — waiting for review ✔':'Task complete ✔') : r.advanced ? 'Done — next step activated ➜' : 'Step done ✔');
    closeModal(); renderTasks();
  } catch(e){ toast('⚠ '+e.message); if(go){ go.disabled=false; go.textContent='Mark done'; } }
}
function tkReverseModal(taskId, stepId, name){
  modal(`<b style="font-size:15px">Send back — ${name}</b>
    <div style="font-size:12px;color:var(--muted);margin-top:4px">This re-opens the step with a fresh SLA clock and returns everything after it to pending. A reason is required.</div>
    <textarea id="tk-reason" class="inp" rows="3" placeholder="Why is this going back?" style="margin-top:10px"></textarea>
    <div class="row" style="justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" onclick="closeModal()">Back</button>
      <button class="btn" style="color:var(--stop)" onclick="tkReverse('${taskId}','${stepId}')">Send back</button></div>`);
}
async function tkReverse(taskId, stepId){
  const reason=document.getElementById('tk-reason')?.value.trim();
  if(!reason){ toast('A reason is required'); return; }
  try { await api(`/api/fm/tasks/${taskId}/steps/${stepId}/reverse`,{method:'POST',body:{reason}});
    toast('Step sent back ↩'); closeModal(); renderTasks();
  } catch(e){ toast('⚠ '+e.message); }
}
async function tkApprove(id){
  try { await api(`/api/fm/tasks/${id}/approve`,{method:'POST'}); toast('Approved ✔'); closeModal(); renderTasks(); }
  catch(e){ toast('⚠ '+e.message); }
}
async function tkCancel(id){
  modal(`<b style="font-size:15px">Cancel this task?</b>
    <div style="font-size:12px;color:var(--muted);margin-top:4px">All pending and active steps stop. The timeline is kept.</div>
    <div class="row" style="justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" onclick="closeModal()">Keep it</button>
      <button class="btn" style="color:var(--stop)" onclick="tkCancelGo('${id}')">Cancel task</button></div>`);
}
async function tkCancelGo(id){
  try { await api(`/api/fm/tasks/${id}/cancel`,{method:'POST'}); toast('Task cancelled'); closeModal(); renderTasks(); }
  catch(e){ toast('⚠ '+e.message); }
}

// ----- builder -----
async function openTaskBuilder(){
  if(!S.tk.pick){
    try { S.tk.pick = await api('/api/fm/tasks/pickers'); }
    catch(e){ toast('⚠ '+e.message); return; }
  }
  S.tk.steps = [{ name:'', department_id:'', with_previous:false, assignees:[] }];
  tkBuilderPaint();
}
function tkBuilderPaint(){
  const { users, departments } = S.tk.pick;
  const deptOpt = sel => `<option value="">— dept —</option>`+departments.map(d=>`<option value="${d.id}" ${String(sel)===String(d.id)?'selected':''}>${esc(d.name)} (${d.sla_hours}h SLA)</option>`).join('');
  const stepCard = (st,i) => `
    <div class="card" style="padding:10px;margin-top:8px">
      <div class="row" style="gap:8px;align-items:center">
        <b style="flex:none;color:var(--muted);font-size:12px">${i+1}</b>
        <input class="inp" style="flex:1" placeholder="Step name (e.g. Raise PO)" value="${esc(st.name)}"
          oninput="S.tk.steps[${i}].name=this.value">
        ${i>0?`<label style="font-size:11px;color:var(--muted);flex:none"><input type="checkbox" ${st.with_previous?'checked':''}
          onchange="S.tk.steps[${i}].with_previous=this.checked;tkBuilderPaint()"> with previous</label>`:''}
        ${S.tk.steps.length>1?`<button class="btn sm" onclick="S.tk.steps.splice(${i},1);tkBuilderPaint()">×</button>`:''}
      </div>
      <div class="row" style="gap:8px;margin-top:8px">
        <select class="inp" style="flex:1" onchange="S.tk.steps[${i}].department_id=this.value;tkBuilderPaint()">${deptOpt(st.department_id)}</select>
        <select class="inp" multiple size="3" style="flex:1.4" onchange="S.tk.steps[${i}].assignees=[...this.selectedOptions].map(o=>o.value)">
          ${users.filter(u=>!st.department_id||String(u.department_id)===String(st.department_id))
            .map(u=>`<option value="${u.id}" ${st.assignees.includes(u.id)?'selected':''}>${esc(u.name)} (${esc(u.code)})</option>`).join('')}
        </select>
      </div>
    </div>`;
  const reviewers = users.filter(u=>u.task_role==='reviewer');
  modal(`<div class="m-h"><b>New task</b><button class="m-x" onclick="closeModal()">×</button></div>
    <input id="tkb-title" class="inp" placeholder="Task title (e.g. LPG procurement — August)" style="margin-top:10px" value="${esc(S.tk.title||'')}" oninput="S.tk.title=this.value">
    <textarea id="tkb-desc" class="inp" rows="2" placeholder="Description (optional)" style="margin-top:8px" oninput="S.tk.desc=this.value">${esc(S.tk.desc||'')}</textarea>
    <div class="row" style="gap:8px;margin-top:8px">
      <select id="tkb-pri" class="inp" style="flex:1">
        ${['normal','high','critical','low'].map(x=>`<option ${S.tk.pri===x?'selected':''}>${x}</option>`).join('')}</select>
      <select id="tkb-rev" class="inp" style="flex:1.4">
        <option value="">No reviewer (auto-approve)</option>
        ${reviewers.map(u=>`<option value="${u.id}">${esc(u.name)} — reviewer</option>`).join('')}</select>
    </div>
    <div class="h2" style="margin-top:12px">Steps <span style="font-size:11px;color:var(--muted);font-weight:400">— "with previous" runs steps in parallel</span></div>
    <div style="max-height:300px;overflow:auto">${S.tk.steps.map(stepCard).join('')}</div>
    <button class="btn sm" style="margin-top:8px" onclick="S.tk.steps.push({name:'',department_id:'',with_previous:false,assignees:[]});tkBuilderPaint()">+ Add step</button>
    <div class="row" style="justify-content:flex-end;gap:8px;margin-top:12px">
      <button class="btn" onclick="closeModal()">Back</button>
      <button class="btn p" id="tkb-go" onclick="tkCreate()">Launch task</button></div>`);
}
async function tkCreate(){
  const title=(S.tk.title||'').trim();
  if(!title){ toast('Give the task a title'); return; }
  if(S.tk.steps.some(x=>!x.name.trim())){ toast('Every step needs a name'); return; }
  if(S.tk.steps.some(x=>!x.assignees.length)){ toast('Every step needs at least one assignee'); return; }
  const go=document.getElementById('tkb-go'); if(go){ if(go.disabled) return; go.disabled=true; go.textContent='Launching…'; }
  try {
    const r = await api('/api/fm/tasks',{method:'POST',body:{
      title, description:(S.tk.desc||'').trim()||null,
      priority:document.getElementById('tkb-pri').value,
      reviewer_id:document.getElementById('tkb-rev').value||null,
      steps:S.tk.steps }});
    toast(`Task ${r.task.ref} launched — first step is live 🚀`);
    S.tk.title=''; S.tk.desc='';
    closeModal(); S.tk.view='all'; renderTasks();
  } catch(e){ toast('⚠ '+e.message); if(go){ go.disabled=false; go.textContent='Launch task'; } }
}

// ---------------- boot + PWA ----------------
(async () => {
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch {} }
  if (await tryResume()) enterApp();
})();
</script>
