<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#14181D"/>
<title>Future Makers</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon-192.png"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --ink:#14181D; --paper:#F6F4EA; --signal:#D65A1E; --go:#1F7A4D; --stop:#B13636;
  --card:#fff; --line:#e6e2d6; --muted:#6b7078; --lgo:#e7f3ec;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
.hide{display:none!important}
/* ---------- login ---------- */
#login{min-height:100vh;display:flex;flex-direction:column}
.lg-top{background:var(--ink);color:#fff;padding:44px 24px 34px;display:flex;flex-direction:column;gap:14px}
.lg-brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:21px;letter-spacing:.2px}
.lg-h{font-size:26px;font-weight:800;line-height:1.25;margin-top:8px}
.lg-sub{color:#c9cdd4;font-size:14px;line-height:1.5}
.lg-form{flex:1;padding:28px 24px;max-width:430px;width:100%;margin:0 auto}
.lg-lbl{font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin:14px 0 6px}
.lg-inp{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:16px}
.lg-inp:focus{outline:none;border-color:var(--signal)}
.lg-btn{width:100%;margin-top:22px;padding:14px;border:none;border-radius:12px;background:var(--signal);color:#fff;font-weight:800;font-size:16px;box-shadow:0 8px 24px rgba(214,90,30,.35)}
.lg-err{margin-top:12px;color:var(--stop);font-size:13.5px;font-weight:600}
/* ---------- shell ---------- */
#shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.topbar .nm{font-weight:800;font-size:16px}
.topbar .who{margin-left:auto;text-align:right;font-size:11.5px;color:#c9cdd4;line-height:1.3}
.role-tag{display:inline-block;background:var(--signal);color:#fff;border-radius:6px;padding:1px 7px;font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}
.main{flex:1;padding:16px;max-width:960px;width:100%;margin:0 auto;padding-bottom:86px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;padding:9px 4px 8px;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--muted)}
.tab .ic{font-size:19px}
.tab.on{color:var(--signal)}
/* ---------- cards & bits ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.h1{font-size:18px;font-weight:800;margin:4px 0 12px}
.h2{font-size:14px;font-weight:800;color:var(--go);margin:0 0 8px}
.btn{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-weight:700;font-size:13.5px}
.btn.p{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.g{background:var(--go);border-color:var(--go);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--stop);border-color:#eac9c9}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inp{padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;width:100%}
.lbl{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.3px;text-transform:uppercase;margin:10px 0 4px;display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px;background:#faf8f0;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
td{padding:8px;border-top:1px solid var(--line);vertical-align:middle}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700}
.pill.on{background:var(--lgo);color:var(--go)} .pill.off{background:#f6e3e3;color:var(--stop)}
.dept{display:inline-block;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;color:#fff}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 14px;text-align:center}
.tile .ic{font-size:30px}
.tile .t{font-weight:800;margin-top:8px}
.tile .s{font-size:11.5px;color:var(--muted);margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.soon{opacity:.55}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.3)}
/* ---------- chat ---------- */
.cl-item{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.cl-av{width:44px;height:44px;border-radius:50%;background:var(--go);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.cl-av.g{background:var(--signal);border-radius:14px}
.cl-mid{flex:1;min-width:0}
.cl-t{font-weight:800;font-size:14.5px}
.cl-s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.cl-right{text-align:right;flex:none}
.cl-time{font-size:11px;color:var(--muted)}
.cl-badge{background:var(--go);color:#fff;border-radius:12px;font-size:11px;font-weight:800;padding:1px 7px;display:inline-block;margin-top:4px}
#conv{position:fixed;inset:0;background:var(--paper);z-index:30;display:flex;flex-direction:column}
.cv-head{background:var(--ink);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px}
.cv-back{border:none;background:none;color:#fff;font-size:22px;padding:2px 6px}
.cv-t{font-weight:800;font-size:15px}
.cv-s{font-size:11px;color:#c9cdd4}
.cv-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:78%;padding:8px 11px;border-radius:14px;font-size:14px;line-height:1.4;position:relative;word-wrap:break-word}
.bub.me{align-self:flex-end;background:#fde8dc;border:1px solid #f3cdb8;border-bottom-right-radius:4px}
.bub.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.sys{align-self:center;background:#efece0;color:var(--muted);font-size:11.5px;border-radius:10px;padding:4px 12px}
.bub .snd{font-size:11px;font-weight:800;color:var(--go);margin-bottom:2px}
.bub .meta{font-size:10px;color:var(--muted);text-align:right;margin-top:3px;display:flex;gap:4px;justify-content:flex-end;align-items:center}
.tick{font-size:11px}.tick.read{color:var(--go);font-weight:800}
.bub img{max-width:100%;border-radius:10px;display:block}
.bub audio{width:210px;max-width:100%}
.doccard{display:flex;gap:8px;align-items:center;background:#faf8f0;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer}
.cv-comp{background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end}
.cv-inp{flex:1;border:1.5px solid var(--line);border-radius:20px;padding:10px 14px;font-size:15px;max-height:110px;resize:none}
.cv-btn{width:44px;height:44px;border-radius:50%;border:none;font-size:19px;flex:none;display:grid;place-items:center}
.cv-send{background:var(--signal);color:#fff}
.cv-attach{background:#f1eee4}
.cv-mic{background:var(--go);color:#fff}
.cv-mic.rec{background:var(--stop);animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
.attach-menu{position:absolute;bottom:64px;left:10px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.15);overflow:hidden;z-index:35}
.attach-menu button{display:flex;gap:10px;align-items:center;width:100%;border:none;background:none;padding:12px 18px;font-size:14px;font-weight:600}
.fab{position:fixed;right:18px;bottom:86px;width:56px;height:56px;border-radius:50%;border:none;background:var(--signal);color:#fff;font-size:26px;box-shadow:0 10px 26px rgba(214,90,30,.4);z-index:25}
/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,24,29,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.overlay{align-items:center}}
.modal{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:18px}
@media(min-width:640px){.modal{border-radius:18px}}
.m-h{display:flex;align-items:center;margin-bottom:10px}
.m-h b{font-size:16px}
.m-x{margin-left:auto;border:none;background:none;font-size:22px;color:var(--muted)}
.chk{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f1eee4;font-size:13.5px}
.chk input{width:18px;height:18px;accent-color:var(--go)}
.switchrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f1eee4}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <div class="lg-top">
    <div class="lg-brand"><span id="lg-mark"></span> Future Makers</div>
    <div class="lg-h">One app for your whole company.</div>
    <div class="lg-sub">Instructions, chat, meetings and tasks — with delivery you can see.</div>
  </div>
  <div class="lg-form">
    <div class="lg-lbl">Employee Code</div>
    <input id="lg-code" class="lg-inp" autocomplete="username" placeholder="e.g. FM001"/>
    <div class="lg-lbl">Password</div>
    <input id="lg-pass" class="lg-inp" type="password" autocomplete="current-password" placeholder="Your password" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="lg-btn" onclick="doLogin()">Sign in</button>
    <div id="lg-err" class="lg-err"></div>
  </div>
</div>

<!-- ================= SHELL ================= -->
<div id="shell" class="hide">
  <div class="topbar">
    <span id="tb-mark"></span><span class="nm">Future Makers</span>
    <div class="who"><div id="tb-name"></div><span class="role-tag" id="tb-role"></span></div>
  </div>
  <div class="main" id="main"></div>
  <div class="tabs" id="tabs"></div>
</div>

<div id="modal-root"></div>

<script>
const API = window.FM_CONFIG.API_BASE;
const sb = supabase.createClient(window.FM_CONFIG.SUPABASE_URL, window.FM_CONFIG.SUPABASE_ANON_KEY);
const FM_MARK = (size=34, opts={}) => {
  const { tile=true, glyph='#fff', tileColor='#D65A1E' } = opts;
  const inner = `<svg width="${Math.round(size*0.62)}" height="${Math.round(size*0.62)}" viewBox="0 0 28 28" fill="none" style="display:block">
    <circle cx="9" cy="14" r="3.2" fill="${tile?glyph:tileColor}"/>
    <path d="M14.5 8 a8 8 0 0 1 0 12" stroke="${tile?glyph:tileColor}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M18.5 4.5 a13 13 0 0 1 0 19" stroke="${tile?glyph:tileColor}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  </svg>`;
  if (!tile) return inner;
  return `<span style="width:${size}px;height:${size}px;border-radius:${Math.round(size*0.26)}px;background:${tileColor};display:inline-grid;place-items:center;flex:none">${inner}</span>`;
};
document.getElementById('lg-mark').innerHTML = FM_MARK(40);
document.getElementById('tb-mark').innerHTML = FM_MARK(30);

let S = { profile:null, features:{}, page:'home', users:[], depts:[], matrix:null };
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

async function token(){ const { data } = await sb.auth.getSession(); return data?.session?.access_token || null; }
async function api(path, opts={}){
  const t = await token();
  const headers = { ...(opts.headers||{}) };
  if (!(opts.body instanceof FormData)) headers['Content-Type']='application/json';
  if (t) headers['Authorization'] = 'Bearer '+t;
  const res = await fetch(API+path, { ...opts, headers, body: opts.body instanceof FormData ? opts.body : (opts.body ? JSON.stringify(opts.body) : undefined) });
  let j = {}; try { j = await res.json(); } catch {}
  if (!res.ok) throw new Error(j.error || ('HTTP '+res.status));
  return j;
}

// ---------------- auth ----------------
async function doLogin(){
  const code = document.getElementById('lg-code').value.trim();
  const pass = document.getElementById('lg-pass').value;
  const err = document.getElementById('lg-err'); err.textContent='';
  if (!code || !pass) { err.textContent='Enter your code and password.'; return; }
  try {
    const r = await fetch(API+'/api/fm/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ code, password: pass }) });
    const j = await r.json();
    if (!r.ok) { err.textContent = j.error || 'Login failed'; return; }
    await sb.auth.setSession({ access_token: j.session.access_token, refresh_token: j.session.refresh_token });
    S.profile = j.profile; S.features = j.features;
    enterApp();
  } catch { err.textContent = 'Cannot reach server — check internet and try again.'; }
}
async function tryResume(){
  const t = await token();
  if (!t) return false;
  try { const j = await api('/api/fm/auth/me'); S.profile=j.profile; S.features=j.features; return true; }
  catch { await sb.auth.signOut(); return false; }
}
async function doLogout(){ await sb.auth.signOut(); location.reload(); }

function enterApp(){
  document.getElementById('login').classList.add('hide');
  document.getElementById('shell').classList.remove('hide');
  document.getElementById('tb-name').textContent = S.profile.name;
  document.getElementById('tb-role').textContent = S.profile.platform_role.replace('_',' ');
  renderTabs(); go('home');
}

// ---------------- nav ----------------
const isAdmin = () => ['super_admin','admin'].includes(S.profile?.platform_role);
function renderTabs(){
  const tabs = [
    { id:'home', ic:'🏠', t:'Home' },
    { id:'chat', ic:'💬', t:'Chat' },
    { id:'broadcast', ic:'📣', t:'Broadcast', soon:true },
    { id:'tasks', ic:'✅', t:'Tasks', soon:true },
    ...(isAdmin() ? [{ id:'admin', ic:'🛠', t:'Admin' }] : []),
    { id:'profile', ic:'👤', t:'Me' },
  ];
  document.getElementById('tabs').innerHTML = tabs.map(x =>
    `<button class="tab ${S.page===x.id?'on':''}" onclick="${x.soon?`toast('${x.t} arrives in the next stage')`:`go('${x.id}')`}">
      <span class="ic">${x.ic}</span>${x.t}</button>`).join('');
}
function go(p){ S.page=p; renderTabs(); ({home:renderHome, admin:renderAdmin, profile:renderProfile, chat:renderChat}[p]||renderHome)(); }

// ---------------- HOME ----------------
function renderHome(){
  const f = S.features;
  const tile = (ic,t,s,soon) => `<div class="tile ${soon?'soon':''}"><div class="ic">${ic}</div><div class="t">${t}</div><div class="s">${s}</div></div>`;
  document.getElementById('main').innerHTML = `
    <div class="h1">Hello, ${esc(S.profile.name.split(' ')[0])} 👋</div>
    <div class="grid2">
      ${f.chat_direct||f.chat_groups ? `<div class="tile" onclick="go('chat')" style="cursor:pointer"><div class="ic">💬</div><div class="t">Chat</div><div class="s">Messages · groups · media</div></div>`:''}
      ${tile('📣', f.broadcast_create?'Broadcasts':'Announcements', 'Coming in Stage D3',1)}
      ${f.tasks_view ? tile('✅','Tasks','Full WatchOwl · Stage D4',1):''}
      ${f.meetings_join ? tile('📅','Meetings','Meet + AI minutes · Stage D5',1):''}
      ${isAdmin() ? `<div class="tile" onclick="go('admin')" style="cursor:pointer;border-color:var(--signal)"><div class="ic">🛠</div><div class="t">Admin</div><div class="s">Users · Departments · Access</div></div>`:''}
      ${tile('🛰','Platform','Stage D1 live — foundation running',0)}
    </div>
    <div class="card" style="margin-top:14px">
      <div class="h2">Your access</div>
      <div style="font-size:13px;color:var(--muted);line-height:1.7">
        ${Object.entries(f).filter(([k,v])=>v===true).map(([k])=>`<span class="pill on" style="margin:2px 3px 2px 0">${k.replace(/_/g,' ')}</span>`).join('')}
      </div>
    </div>`;
}

// ---------------- ADMIN ----------------
async function loadAdmin(){
  const [u, d, m] = await Promise.all([ api('/api/fm/users'), api('/api/fm/departments'), api('/api/fm/matrix') ]);
  S.users=u.users||[]; S.depts=d.departments||[]; S.matrix=m;
}
async function renderAdmin(){
  document.getElementById('main').innerHTML = `<div class="h1">Admin</div><div class="card">Loading…</div>`;
  try { await loadAdmin(); } catch(e){ document.getElementById('main').innerHTML = `<div class="card">⚠ ${esc(e.message)}</div>`; return; }
  const deptName = id => { const d=S.depts.find(x=>x.id===id); return d?`<span class="dept" style="background:${d.color}">${esc(d.name)}</span>`:'—'; };
  document.getElementById('main').innerHTML = `
    <div class="h1">Admin</div>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div class="h2" style="margin:0">Users (${S.users.length})</div>
        <div class="row">
          <button class="btn sm" onclick="openImport()">📄 Import Excel</button>
          <button class="btn sm p" onclick="openUser()">+ Add user</button>
        </div>
      </div>
      <div style="overflow-x:auto;margin-top:10px">
      <table><thead><tr><th>Code</th><th>Name</th><th>Dept</th><th>Role</th><th>Task role</th><th>Status</th><th></th></tr></thead>
      <tbody>${S.users.map(u=>`
        <tr>
          <td><b>${esc(u.code)}</b></td>
          <td>${esc(u.name)}<div style="font-size:11px;color:var(--muted)">${esc(u.email||u.phone||'')}</div></td>
          <td>${deptName(u.department_id)}</td>
          <td>${esc(u.platform_role.replace('_',' '))}</td>
          <td>${esc(u.task_role||'—')}</td>
          <td><span class="pill ${u.is_active?'on':'off'}">${u.is_active?'Active':'Off'}</span></td>
          <td style="white-space:nowrap"><button class="btn sm" onclick="openUser('${u.id}')">Edit</button></td>
        </tr>`).join('')}</tbody></table>
      </div>
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div class="h2" style="margin:0">Departments</div>
        <button class="btn sm p" onclick="openDept()">+ Add</button>
      </div>
      <div style="margin-top:8px">${S.depts.map(d=>`
        <div class="switchrow"><div><span class="dept" style="background:${d.color}">${esc(d.name)}</span>
          <span style="font-size:11.5px;color:var(--muted);margin-left:8px">SLA ${d.sla_hours}h</span></div>
          <button class="btn sm" onclick="openDept(${d.id})">Edit</button></div>`).join('')}</div>
    </div>
    ${S.profile.platform_role==='super_admin' ? `
    <div class="card">
      <div class="h2">Feature defaults by role</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px">What each role can use unless overridden per user. Server-enforced.</div>
      ${['admin','broadcaster','employee'].map(r=>`<button class="btn sm" style="margin:0 6px 6px 0" onclick="openDefaults('${r}')">${r}</button>`).join('')}
    </div>`:''}`;
}

// ----- user modal -----
function modal(html){ document.getElementById('modal-root').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`; }
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

const FEATS = [['chat_direct','1-to-1 chat'],['chat_groups','Group chat'],['groups_create','Create groups'],['broadcast_create','Create broadcasts'],['broadcast_email','Email channel'],['tasks_view','See tasks'],['tasks_create','Create tasks'],['meetings_join','Join meetings'],['meetings_schedule','Schedule meetings'],['reports_view','Reports'],['media_video','Send video'],['media_voice','Send voice notes']];

function openUser(id){
  const u = id ? S.users.find(x=>x.id===id) : null;
  const superMe = S.profile.platform_role==='super_admin';
  const eff = u ? u.features||{} : {};
  modal(`
    <div class="m-h"><b>${u?'Edit user':'Add user'}</b><button class="m-x" onclick="closeModal()">×</button></div>
    <label class="lbl">Employee code</label><input id="u-code" class="inp" value="${esc(u?.code||'')}" ${u?'disabled':''}/>
    <label class="lbl">Name</label><input id="u-name" class="inp" value="${esc(u?.name||'')}"/>
    <label class="lbl">Phone</label><input id="u-phone" class="inp" value="${esc(u?.phone||'')}"/>
    <label class="lbl">Email (for email broadcasts)</label><input id="u-email" class="inp" value="${esc(u?.email||'')}"/>
    <label class="lbl">Department</label>
    <select id="u-dept" class="inp"><option value="">—</option>${S.depts.map(d=>`<option value="${d.id}" ${u?.department_id===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select>

async function saveUser(id){
  const v = x => document.getElementById(x)?.value?.trim();
  try {
    if (!id) {
      await api('/api/fm/users', { method:'POST', body:{ code:v('u-code'), name:v('u-name'), phone:v('u-phone'), email:v('u-email'),
        department_id: v('u-dept')?Number(v('u-dept')):null, platform_role:v('u-role'), task_role:v('u-task')||null, password:v('u-pass') }});
      toast('User created');
    } else {
      const body = { name:v('u-name'), phone:v('u-phone'), email:v('u-email'),
        department_id: v('u-dept')?Number(v('u-dept')):null, task_role:v('u-task')||null };
      if (S.profile.platform_role==='super_admin') {
        body.platform_role = v('u-role');
        const features = {};
        for (const [k] of FEATS) {
          const el = document.getElementById('f-'+k); if (!el) continue;
          if (el.dataset.cleared==='1') continue;         // cleared → role default
          const orig = (S.users.find(x=>x.id===id)?.features)||{};
          if (el.checked) features[k]=true;
          else if (k in orig) features[k]=false;          // explicit off only if previously overridden
        }
        body.features = features;
      }
      await api('/api/fm/users/'+id, { method:'PATCH', body });
      toast('Saved');
    }
    closeModal(); renderAdmin();
  } catch(e){ toast('⚠ '+e.message); }
}

  try { await api(`/api/fm/users/${id}/reset-password`, { method:'POST', body:{ password:p } }); toast('Password reset'); }

function readByAll(m){
  const others = S.chat.reads.filter(r=>r.user_id!==S.profile.id);
  return others.length>0 && others.every(r=>new Date(r.last_read_at)>=new Date(m.created_at));

function paintMsgs(){
  const box = document.getElementById('cv-msgs'); if(!box) return;
  box.innerHTML = S.chat.msgs.map(m=>{
    if(m.kind==='system') return `<div class="bub sys">${esc(m.body||'')}</div>`;
    const mine = m.sender_id===S.profile.id;
    const who = mine?'':(S.chat.active.kind==='group'?`<div class="snd">${esc(m.fm_users?.name||dirName(m.sender_id))}</div>`:'');
    let content = '';
    if(m.kind==='text') content = esc(m.body||'').replace(/\n/g,'<br/>');
    else if(m.kind==='image') content = `<img data-media="${esc(m.media_path)}" alt="photo"/>` + (m.body?`<div>${esc(m.body)}</div>`:'');
    else if(m.kind==='video') content = `<div class="doccard" onclick="openMedia('${esc(m.media_path)}')">🎥 <b>${esc(m.media_name||'Video')}</b></div>`;
    else if(m.kind==='audio') content = `<audio controls preload="none" data-audio="${esc(m.media_path)}"></audio>`;
    else content = `<div class="doccard" onclick="openMedia('${esc(m.media_path)}')">📄 <b style="word-break:break-all">${esc(m.media_name||'File')}</b></div>`;
    const tick = mine?`<span class="tick ${readByAll(m)?'read':''}">${readByAll(m)?'✓✓':'✓'}</span>`:'';
    return `<div class="bub ${mine?'me':'them'}">${who}${content}<div class="meta">${tfmt(m.created_at)} ${tick}</div></div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
  box.querySelectorAll('[data-media]').forEach(async img=>{ img.src = await mediaUrl(img.dataset.media); });
  box.querySelectorAll('[data-audio]').forEach(async a=>{ a.src = await mediaUrl(a.dataset.audio); });
}
async function mediaUrl(path){
  if(S.chat.urls[path]) return S.chat.urls[path];
  try { const j = await api('/api/fm/chat/media?path='+encodeURIComponent(path)); S.chat.urls[path]=j.url; return j.url; }
  catch { return ''; }
}

async function sendText(){

    const j = await api('/api/fm/chat/conversations/'+S.chat.active.id+'/messages',{method:'POST',body:{kind:'text',body}});

// ----- attachments -----
function toggleAttach(){ document.getElementById('attach-menu').classList.toggle('hide'); }
function pickMedia(kind){
  toggleAttach();
  const f = document.getElementById('cv-file');
  f.accept = kind==='image'?'image/*':kind==='video'?'video/*':'*/*';
  f.onchange = () => f.files[0] && sendMedia(kind, f.files[0]);
  f.value=''; f.click();
}
async function fileToB64(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(file); });
}
async function compressImage(file){
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 1600/Math.max(bmp.width,bmp.height));
  const c = document.createElement('canvas'); c.width=Math.round(bmp.width*scale); c.height=Math.round(bmp.height*scale);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.8).split(',')[1];
}
async function sendMedia(kind, file, blobOverride){
  toast('Uploading…');
  try {
    let data, content_type = file?.type || 'application/octet-stream', name = file?.name || (kind+'.webm');
    if(kind==='image'){ data = await compressImage(file); content_type='image/jpeg'; }
    else if(blobOverride){ data = await fileToB64(blobOverride); }
    else { data = await fileToB64(file); }
    const up = await api('/api/fm/chat/media',{method:'POST',body:{conversation_id:S.chat.active.id,kind,name,data,content_type}});
    const j = await api('/api/fm/chat/conversations/'+S.chat.active.id+'/messages',{method:'POST',
      body:{kind,media_path:up.path,media_name:name,media_size:up.size}});
    pushLocal(j.message);
  } catch(e){ toast('⚠ '+e.message); }
}

// ----- voice notes (hold to record) -----
let rec=null, recChunks=[];
function wireMic(){
  const btn = document.getElementById('cv-mic'); if(!btn) return;
  const start = async e => { e.preventDefault();
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      recChunks=[]; rec = new MediaRecorder(stream);
      rec.ondataavailable = ev=>recChunks.push(ev.data);
      rec.onstop = () => {
        stream.getTracks().forEach(t=>t.stop());
        const blob = new Blob(recChunks,{type:'audio/webm'});
        if(blob.size>1200) sendMedia('audio', {name:'voice-note.webm', type:'audio/webm'}, blob);
      };
      rec.start(); btn.classList.add('rec');
    } catch { toast('Microphone permission needed'); }
  };
  const stop = e => { e.preventDefault(); if(rec&&rec.state!=='inactive'){ rec.stop(); } btn.classList.remove('rec'); };
  btn.addEventListener('mousedown',start); btn.addEventListener('touchstart',start,{passive:false});
  btn.addEventListener('mouseup',stop); btn.addEventListener('mouseleave',stop); btn.addEventListener('touchend',stop);
}

// ----- realtime -----
function ensureRealtime(){
  if(S.chat.sub) return; S.chat.sub = true;
  sb.channel('fm-chat')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'fm_messages'}, payload => {
      const m = payload.new;
      if(S.chat.active && m.conversation_id===S.chat.active.id){
        pushLocal(m);
        api('/api/fm/chat/conversations/'+m.conversation_id+'/read',{method:'POST'}).catch(()=>{});
      } else if(S.page==='chat' && !S.chat.active){
        renderChat();
      } else if(m.sender_id!==S.profile.id){
        toast('💬 New message');
      }
    })
    .subscribe();
}

// ---------------- boot + PWA ----------------
(async () => {
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch {} }
  if (await tryResume()) enterApp();
})();
</script>
